name: Desktop release

# Builds the web/ frontend into the Electron shell in web-desktop/ for Linux
# (x64 + arm64), Windows and macOS, plus the Android app in android/, then
# publishes one GitHub release with all packages and the latest*.yml feeds for
# electron-updater on every push to main.
# The server image for the same version goes to ghcr.io/<owner>/opentick.
#
# Standard GitHub-hosted runners (including macOS, Windows and Linux arm64)
# are free for public repositories.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            targets: --linux deb AppImage --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            targets: --linux deb AppImage --arm64
          - name: windows
            os: windows-latest
            targets: --win nsis --x64
          - name: mac
            os: macos-latest
            targets: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates: builds are unsigned (macOS gets an ad-hoc signature).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web-desktop/package-lock.json

      - name: Build frontend
        working-directory: web
        shell: bash
        run: |
          npm ci
          APP_VERSION="$VERSION" WEB_OUT_DIR=../web-desktop/app npm run build

      - name: Build desktop packages
        working-directory: web-desktop
        shell: bash
        run: |
          npm ci
          npx electron-builder ${{ matrix.targets }} --publish never -c.extraMetadata.version="$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            web-desktop/dist/*.deb
            web-desktop/dist/*.AppImage
            web-desktop/dist/*.exe
            web-desktop/dist/*.dmg
            web-desktop/dist/*.zip
            web-desktop/dist/*.blockmap
            web-desktop/dist/latest*.yml

  # The APK is signed with the permanent release key from the ANDROID_* secrets,
  # so each release installs as an update over the last one. Without them it
  # falls back to a throwaway debug key and says so in the release notes.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Write signing config
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key and can't update earlier installs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionCode="${{ github.run_number }}" -PversionName="$VERSION"
          mkdir -p dist
          apk="OpenTick-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          # Feed for the app's updater (android/.../update/Updater.kt). Only for
          # APKs signed with the release key: others can't update installs.
          if [ -f keystore.properties ]; then
            jq -n \
              --argjson versionCode "${{ github.run_number }}" \
              --arg versionName "$VERSION" \
              --arg url "https://github.com/${{ github.repository }}/releases/download/desktop-v$VERSION/$apk" \
              --arg sha256 "$(sha256sum "dist/$apk" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "dist/$apk")" \
              '{versionCode: $versionCode, versionName: $versionName, url: $url, sha256: $sha256, size: $size}' \
              > dist/latest-android.json
            cat dist/latest-android.json
          fi
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          if-no-files-found: error
          path: |
            android/dist/*.apk
            android/dist/latest-android.json

  # Publishes the server image for the same version, so a desktop release never
  # exists without a matching server. Self-hosted updaters only install images
  # whose keyless cosign signature comes from this workflow on main.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The xgo builder image plus its cache no longer fit on the runner's disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The Dockerfile cross-compiles on the build platform, so arm64 needs no emulation.
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker buildx create --use
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg RELEASE_VERSION="$VERSION" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --push \
            --metadata-file meta.json

      - name: Sign
        run: |
          digest=$(jq -r '."containerimage.digest"' meta.json)
          cosign sign --yes "$IMAGE@$digest"

  release:
    needs: [build, android, server-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags for the changelog below.
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(git describe --tags --match 'desktop-v*' --abbrev=0 2>/dev/null || true)
          {
            echo "Built from ${GITHUB_SHA::8}."
            echo
            echo "### Downloads"
            echo "- **Linux:** \`.deb\` or \`.AppImage\` (x64 / arm64)"
            echo "- **Windows:** \`.exe\` installer (x64, also runs on Windows on ARM). Unsigned: click \"More info\" → \"Run anyway\" if SmartScreen warns."
            echo "- **Android:** \`.apk\` (Android 8.0+). Open it on your phone and allow installing from your browser or file manager when asked. After that the app updates itself (Settings → About)."
            echo "- **macOS:** \`.dmg\` (x64 for Intel, arm64 for Apple Silicon). The app is unsigned: right-click → Open on first launch, or run \`xattr -cr /Applications/OpenTick.app\`."
            echo
            echo "### Changes"
            git log --no-merges --format='- %s' ${previous:+$previous..}HEAD | head -50
          } > notes.md
          gh release create "desktop-v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "OpenTick $VERSION" \
            --notes-file notes.md \
            --latest
