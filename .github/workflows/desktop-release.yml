name: Desktop release

# Builds the web/ frontend into the Electron shell in web-desktop/ for Linux
# x64, plus the Android app in android/, then publishes one GitHub release with
# the packages and the latest*.yml feed for electron-updater on every push to
# main. The server image for the same version goes to ghcr.io/<owner>/opentick
# and, when HEROKU_APP_NAME / HEROKU_API_KEY are set, to the hosted Heroku app.
#
# Private repository: runner minutes are billed (macOS 10x, Windows 2x), so
# only the platforms actually in use are built.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - docs/**
      - plans/**
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No signing certificates: builds are unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web-desktop/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          APP_VERSION="$VERSION" WEB_OUT_DIR=../web-desktop/app npm run build

      - name: Build desktop packages
        working-directory: web-desktop
        run: |
          npm ci
          npx electron-builder --linux deb AppImage --x64 --publish never -c.extraMetadata.version="$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          path: |
            web-desktop/dist/*.deb
            web-desktop/dist/*.AppImage
            web-desktop/dist/*.blockmap
            web-desktop/dist/latest*.yml

  # The APK is signed with the permanent release key from the ANDROID_* secrets,
  # so each release installs as an update over the last one. Without them it
  # falls back to a throwaway debug key and says so in the release notes.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Write signing config
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key and can't update earlier installs."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionCode="${{ github.run_number }}" -PversionName="$VERSION"
          mkdir -p dist
          apk="OpenTick-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          # Feed for the app's updater (android/.../update/Updater.kt). Only for
          # APKs signed with the release key: others can't update installs.
          if [ -f keystore.properties ]; then
            jq -n \
              --argjson versionCode "${{ github.run_number }}" \
              --arg versionName "$VERSION" \
              --arg url "https://github.com/${{ github.repository }}/releases/download/desktop-v$VERSION/$apk" \
              --arg sha256 "$(sha256sum "dist/$apk" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "dist/$apk")" \
              '{versionCode: $versionCode, versionName: $versionName, url: $url, sha256: $sha256, size: $size}' \
              > dist/latest-android.json
            cat dist/latest-android.json
          fi
          rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          if-no-files-found: error
          path: |
            android/dist/*.apk
            android/dist/latest-android.json

  # Publishes the server image for the same version, so a desktop release never
  # exists without a matching server. Self-hosted updaters only install images
  # whose keyless cosign signature comes from this workflow on main.
  # The same job then releases it to Heroku: the second build reuses every layer
  # of the first, so hosting costs seconds instead of another full image build.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The xgo builder image plus its cache no longer fit on the runner's disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # amd64 only: self-hosted and Heroku both run x86_64. The layer cache lives
      # in its own GHCR package so base images, npm ci and the xgo toolchain are
      # not rebuilt on every release.
      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: RELEASE_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          push: true
          cache-from: type=registry,ref=${{ env.IMAGE }}-buildcache:main
          cache-to: type=registry,ref=${{ env.IMAGE }}-buildcache:main,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Sign
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Log in to the Heroku registry
        if: vars.HEROKU_APP_NAME != ''
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: echo "$HEROKU_API_KEY" | docker login registry.heroku.com --username=_ --password-stdin

      # Heroku only accepts single-platform images without attestations, in the
      # Docker manifest format rather than OCI.
      - name: Build and push to Heroku
        id: heroku
        if: vars.HEROKU_APP_NAME != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: RELEASE_VERSION=${{ env.VERSION }}
          provenance: false
          sbom: false
          outputs: type=image,name=registry.heroku.com/${{ vars.HEROKU_APP_NAME }}/web,push=true,oci-mediatypes=false
          cache-from: type=registry,ref=${{ env.IMAGE }}-buildcache:main

      - name: Release on Heroku
        if: vars.HEROKU_APP_NAME != ''
        env:
          APP: ${{ vars.HEROKU_APP_NAME }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          METADATA: ${{ steps.heroku.outputs.metadata }}
        run: |
          image_id=$(jq -r '."containerimage.config.digest"' <<<"$METADATA")
          curl --fail-with-body -sS -X PATCH "https://api.heroku.com/apps/$APP/formation" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Content-Type: application/json" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$image_id\"}]}"

  release:
    needs: [build, android, server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags for the changelog below.
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(git describe --tags --match 'desktop-v*' --abbrev=0 2>/dev/null || true)
          {
            echo "Built from ${GITHUB_SHA::8}."
            echo
            echo "### Downloads"
            echo "- **Linux:** \`.deb\` or \`.AppImage\` (x64)"
            echo "- **Android:** \`.apk\` (Android 8.0+). Open it on your phone and allow installing from your browser or file manager when asked. After that the app updates itself (Settings → About)."
            echo
            echo "### Changes"
            git log --no-merges --format='- %s' ${previous:+$previous..}HEAD | head -50
          } > notes.md
          gh release create "desktop-v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "OpenTick $VERSION" \
            --notes-file notes.md \
            --latest
