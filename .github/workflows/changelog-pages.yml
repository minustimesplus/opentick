name: Changelog pages

# Rebuilds the changelog site (changelog/build.mjs) from the desktop-v* tags and
# publishes it to GitHub Pages, together with the web app demo under /demo/
# (VITE_DEMO: no server, example data kept in the browser). Runs after each
# desktop release so the new tag is included, and on web changes for the demo. Requires Settings → Pages → Source: "GitHub Actions" (until that was
# enabled, every run failed in configure-pages with "Get Pages site failed").

on:
  workflow_run:
    workflows: [Desktop release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - changelog/**
      - web/**
      - .github/workflows/changelog-pages.yml
  workflow_dispatch:

concurrency:
  group: changelog-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # A failed desktop release creates no new tag, so there is nothing to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: every tag is a changelog entry.
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build changelog
        run: node changelog/build.mjs changelog/dist

      # The demo runs entirely in the browser (web/src/api/local). Set the
      # HOSTED_URL repository variable to show "Sign up" for the hosted instance.
      - name: Build demo
        working-directory: web
        env:
          VITE_DEMO: '1'
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/demo/
          VITE_HOSTED_URL: ${{ vars.HOSTED_URL }}
          WEB_OUT_DIR: ../changelog/dist/demo
        run: |
          npm ci
          npx vite build
          # Pages answers unknown paths with 404.html: deep links into the demo
          # (e.g. /demo/tasks/today) load the app, anything else goes to the changelog.
          root="${VITE_BASE%demo/}"
          sed "s#<head>#<head><script>if(!location.pathname.startsWith('${VITE_BASE}'))location.replace('${root}')</script>#" \
            ../changelog/dist/demo/index.html > ../changelog/dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: changelog/dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
