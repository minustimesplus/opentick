name: Changelog pages

# Rebuilds the changelog site (changelog/build.mjs) from the desktop-v* tags and
# publishes it to GitHub Pages. Runs after each desktop release so the new tag is
# included. Requires Settings → Pages → Source: "GitHub Actions".

on:
  workflow_run:
    workflows: [Desktop release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - changelog/**
      - .github/workflows/changelog-pages.yml
  workflow_dispatch:

concurrency:
  group: changelog-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: every tag is a changelog entry.
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build changelog
        run: node changelog/build.mjs changelog/dist

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: changelog/dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
